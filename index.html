<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NiiVue IDC</title>
    <style>
      :root { color-scheme: light dark; --bg: #fff; --fg: #111; --muted: #666; --line: #ccc; }
      @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --muted: #999; --line: #333; } }
      * { box-sizing: border-box; }
      body { margin: 0; height: 100vh; display: grid; grid-template-columns: 300px 1fr; background: var(--bg); color: var(--fg); font: 13px system-ui, sans-serif; }
      aside { overflow: auto; padding: 8px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
      main { position: relative; min-width: 0; }
      canvas { width: 100%; height: 100%; display: block; }
      canvas[hidden] { display: none; }
      select, button { width: 100%; font: inherit; }
      #status { color: var(--muted); white-space: pre-wrap; }
      #status.error { color: #d33; }
      .row { display: flex; gap: 6px; align-items: center; }
      #credit { color: var(--muted); font-size: 11px; }
      @media (max-width: 700px) { body { grid-template-columns: 1fr; grid-template-rows: auto 60vh; } aside { max-height: 40vh; } }
    </style>
  </head>
  <body>
    <aside>
      <label>Series <select id="series"></select></label>
      <div id="status">Loading…</div>
      <div id="segments" hidden>
        <div class="row"><label>Opacity <input id="opacity" type="range" min="0" max="1" step="0.05" value="0.5" /></label>
          <label><input id="outline" type="checkbox" /> Outline</label></div>
        <small>Legend: click a colour box to hide/show it, double-click to show only it (again: all).</small>
      </div>
      <div id="credit"></div>
    </aside>
    <main><canvas id="gl"></canvas><canvas id="slide" hidden></canvas></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
